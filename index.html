<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAY vanha Tuplapotti">
<meta name="theme-color" content="#000000">
<title>RAY vanha Tuplapotti</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;padding:12px 16px;text-align:center;background:#1b1b1b}
h1{font-size:18px;margin:0 0 3px}
p{font-size:12px;margin:0;color:#aaa}
#game{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#loading{position:absolute;z-index:5;text-align:center;color:#bbb;font-size:14px;padding:20px}
#error{display:none;position:absolute;z-index:10;max-width:90%;padding:18px;background:#292929;border-radius:10px;color:#fff;text-align:center}
#player{width:min(100%,900px);height:min(100%,700px);background:#000}
object{width:100%;height:100%;display:block;background:#000}
</style>
<script>
window.RufflePlayer=window.RufflePlayer||{};
window.RufflePlayer.config={backgroundColor:"#000000"};
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

</head><body>
<header><h1>RAY vanha Tuplapotti</h1><p>Vanha RAY-peli</p></header>
<main id="game">
<div id="loading">RAY vanha Tuplapotti latautuu…</div><div id="error"></div>
<div id="player"><object type="application/x-shockwave-flash" data="ray-peli-3.swf" width="100%" height="100%">
<param name="movie" value="ray-peli-3.swf"><param name="allowfullscreen" value="true"><param name="wmode" value="window">
</object></div></main>
<script>
(function(){
const loading=document.getElementById("loading"),error=document.getElementById("error");
function showError(msg){loading.style.display="none";error.style.display="block";error.textContent=msg;}
window.addEventListener("error",function(e){if(e.target&&e.target.tagName==="SCRIPT")showError("Rufflea ei saatu ladattua. Päivitä sivu ja kokeile uudelleen.");},true);
setTimeout(function(){if(!window.RufflePlayer)showError("Ruffle ei latautunut. Tarkista internet-yhteys ja päivitä sivu.");else loading.style.display="none";},6000);
})();
</script></body></html>
